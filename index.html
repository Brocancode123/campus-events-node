<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Events</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#e3e6ee;--ac:#3b5bdb;--acx:#fff;--ok:#1b7f4b;--er:#c92a2a;--wa:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa3b5;--bd:#2c3140;--ac:#6c8cff;--acx:#10131c;--ok:#4cc38a;--er:#ff7b7b;--wa:#f0b04a}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--tx:#eceef4;--mu:#9aa3b5;--bd:#2c3140;--ac:#6c8cff;--acx:#10131c;--ok:#4cc38a;--er:#ff7b7b;--wa:#f0b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:1.3rem;margin:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--er)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.05rem;margin:0 0 6px}
.meta{color:var(--mu);font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.tag.c{color:var(--er);border-color:var(--er)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--mu);padding:32px 0}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.er{color:var(--er);font-size:.88rem;margin-top:10px;min-height:1em}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.md{background:var(--card);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:16px}}
.md h3{margin:0 0 4px}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--bd);word-break:break-word}
#toasts{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:9;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.t{padding:11px 14px;border-radius:10px;color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:520px;margin:0 auto;width:100%}
.t.ok{background:#1b7f4b}.t.er{background:#c92a2a}.t.in{background:#444b5e}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🎓 Campus Events</h1><button class="p" onclick="eventForm()">+ New event</button></header>
  <div id="list"></div>
</div>
<div id="toasts"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="md" id="md"></div></div>

<script>
const CATS = ["Academic","Social","Sports","Career","Cultural","Other"];
let EVENTS = [];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => new Date(d + "T00:00").toLocaleDateString(undefined, {weekday:"short", year:"numeric", month:"short", day:"numeric"});
const ev = id => EVENTS.find(e => e.id === id);

function toast(msg, type){
  const el = document.createElement("div");
  el.className = "t " + (type || "in"); el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function openM(html){ document.getElementById("md").innerHTML = html; document.getElementById("ov").classList.add("on"); }
function closeM(){ document.getElementById("ov").classList.remove("on"); }
function showErr(msg){ document.getElementById("err").textContent = msg; toast(msg, "er"); }
const val = id => document.getElementById(id).value.trim();

async function api(method, url, body){
  let r;
  try {
    r = await fetch(url, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  } catch(e) {
    throw new Error("Cannot reach the Java server. Start it, then open http://localhost:3000 in your browser.");
  }
  let d = {};
  try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(d.error || "Request failed (" + r.status + ").");
  return d;
}

async function refresh(){
  try { EVENTS = await api("GET", "/api/events"); render(); }
  catch(e) {
    document.getElementById("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    toast(e.message, "er");
  }
}

function render(){
  const L = document.getElementById("list");
  if (!EVENTS.length) { L.innerHTML = '<div class="empty">No events yet. Tap “+ New event” to create one.</div>'; return; }
  const sorted = [...EVENTS].sort((a, b) => a.date.localeCompare(b.date));
  L.innerHTML = sorted.map(e => {
    const c = e.status === "cancelled";
    return `<div class="card">
      <h2>${esc(e.title)} ${c ? '<span class="tag c">Cancelled</span>' : ""}</h2>
      <div class="meta"><span>📅 ${fmt(e.date)}</span><span>📍 ${esc(e.venue)}</span><span class="tag">${esc(e.category)}</span><span>${e.registrations} registered</span></div>
      <div class="acts">
        <button class="p" ${c ? "disabled" : ""} onclick="regForm('${e.id}')">Register</button>
        <button onclick="viewRegs('${e.id}')">Registrations</button>
        <button onclick="eventForm('${e.id}')">Edit</button>
        ${c ? "" : `<button onclick="confirmAct('${e.id}','cancel')">Cancel event</button>`}
        <button class="d" onclick="confirmAct('${e.id}','delete')">Delete</button>
      </div></div>`;
  }).join("");
}

function eventForm(id){
  const e = id ? ev(id) : {title:"", date:"", venue:"", category:"Academic"};
  openM(`<h3>${id ? "Edit event" : "New event"}</h3>
    <label for="f1">Title</label><input id="f1" value="${esc(e.title)}" maxlength="80">
    <label for="f2">Date</label><input id="f2" type="date" value="${e.date}">
    <label for="f3">Venue</label><input id="f3" value="${esc(e.venue)}" maxlength="80">
    <label for="f4">Category</label><select id="f4">${CATS.map(c => `<option ${c === e.category ? "selected" : ""}>${c}</option>`).join("")}</select>
    <div class="er" id="err"></div>
    <div class="row"><button onclick="closeM()">Close</button><button class="p" onclick="saveEvent('${id || ""}')">${id ? "Save changes" : "Create event"}</button></div>`);
}
async function saveEvent(id){
  const data = {title: val("f1"), date: val("f2"), venue: val("f3"), category: val("f4")};
  try {
    const d = await api(id ? "PUT" : "POST", id ? "/api/events/" + id : "/api/events", data);
    closeM(); toast(d.message, "ok"); refresh();
  } catch(e) { showErr(e.message); }
}

function regForm(id){
  const e = ev(id);
  if (!e || e.status === "cancelled") return toast("This event is cancelled, so registration is closed.", "er");
  openM(`<h3>Register</h3><div class="meta">${esc(e.title)} · ${fmt(e.date)}</div>
    <label for="r1">Full name</label><input id="r1" autocomplete="name" maxlength="80">
    <label for="r2">Email</label><input id="r2" type="email" autocomplete="email" maxlength="120">
    <div class="er" id="err"></div>
    <div class="row"><button onclick="closeM()">Close</button><button class="p" onclick="register('${id}')">Register</button></div>`);
}
async function register(id){
  try {
    const d = await api("POST", "/api/events/" + id + "/registrations", {name: val("r1"), email: val("r2")});
    closeM(); toast(d.message, "ok"); refresh();
  } catch(e) { showErr(e.message); }
}

async function viewRegs(id){
  try {
    const d = await api("GET", "/api/events/" + id + "/registrations"), rs = d.registrations;
    openM(`<h3>Registrations</h3><div class="meta">${esc(d.event)} · ${rs.length} attendee${rs.length === 1 ? "" : "s"}</div>
      ${rs.length ? `<table><tr><th>Name</th><th>Email</th><th></th></tr>${rs.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td><button class="d" onclick="removeReg('${r.id}','${id}')">✕</button></td></tr>`).join("")}</table>` : '<div class="empty">No one has registered yet.</div>'}
      <div class="row"><button onclick="closeM()">Close</button></div>`);
  } catch(e) { toast(e.message, "er"); refresh(); }
}
async function removeReg(rid, eid){
  try {
    const d = await api("DELETE", "/api/registrations/" + rid);
    toast(d.message, "ok"); refresh(); viewRegs(eid);
  } catch(e) { toast(e.message, "er"); }
}

function confirmAct(id, kind){
  const e = ev(id), del = kind === "delete", n = e.registrations;
  openM(`<h3>${del ? "Delete" : "Cancel"} this event?</h3>
    <p>“${esc(e.title)}”${del ? ` will be permanently removed along with its ${n} registration${n === 1 ? "" : "s"}.` : " will be marked as cancelled and closed to new registrations."}</p>
    <div class="row"><button onclick="closeM()">Keep it</button><button class="p" onclick="doAct('${id}','${kind}')">Yes, ${del ? "delete" : "cancel"}</button></div>`);
}
async function doAct(id, kind){
  try {
    const d = kind === "delete" ? await api("DELETE", "/api/events/" + id) : await api("POST", "/api/events/" + id + "/cancel");
    closeM(); toast(d.message, "ok"); refresh();
  } catch(e) { closeM(); toast(e.message, "er"); refresh(); }
}

refresh();
</script>

</body>
</html>
